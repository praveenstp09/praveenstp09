name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: praveenstp09
          outputs: |
            output/github-snake.svg
            output/github-snake-dark.svg
          snake_color: "#38bdf8"
          snake_color2: "#818cf7"

      - name: Push snake animation
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update contribution snake animation"
          add: "output/*.svg"
