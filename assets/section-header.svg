<!-- Reusable section header template - use via query params or separate files -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 52" width="100%">
  <defs>
    <linearGradient id="hdrBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="15%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hdrAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="hdrText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="920" height="52" rx="8" fill="url(#hdrBg)"/>
  <rect x="40" y="48" width="840" height="2" fill="url(#hdrAccent)" opacity="0.6"/>
  <rect x="40" y="12" width="4" height="28" rx="2" fill="url(#hdrAccent)"/>
  <text id="title" x="56" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="700" fill="url(#hdrText)">Section Title</text>
</svg>
