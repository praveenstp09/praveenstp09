<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 12" width="100%" height="12">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="80%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0">
        <animate attributeName="offset" values="-0.3;1.3" dur="2.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="15%" stop-color="#a5f3fc" stop-opacity="1">
        <animate attributeName="offset" values="-0.15;1.45" dur="2.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0">
        <animate attributeName="offset" values="0;1.6" dur="2.5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="4" width="920" height="2" rx="1" fill="url(#lineGrad)"/>
  <rect x="0" y="4" width="920" height="2" rx="1" fill="url(#pulseGrad)"/>
  <circle cx="460" cy="6" r="4" fill="url(#dotGlow)"/>
  <circle cx="460" cy="6" r="2" fill="#e0f2fe"/>
</svg>
