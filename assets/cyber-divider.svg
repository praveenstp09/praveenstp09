<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 20" width="100%" height="20">
  <defs>
    <linearGradient id="dividerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="48%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1"/>
      <stop offset="52%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Node Glow -->
  <circle cx="450" cy="10" r="10" fill="url(#nodeGlow)"/>

  <!-- Horizontal Divider Line -->
  <line x1="20" y1="10" x2="880" y2="10" stroke="url(#dividerLine)" stroke-width="1.5"/>

  <!-- Center Diamond Indicator -->
  <polygon points="450,5 455,10 450,15 445,10" fill="#f8fafc" stroke="#818cf8" stroke-width="1"/>
</svg>
