<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 32" width="100%" height="32">
  <defs>
    <linearGradient id="dividerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="48%" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1"/>
      <stop offset="52%" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes pulse { 0%,100%{opacity:.6;r:12} 50%{opacity:1;r:18} }
    .glow-pulse { animation:pulse 3s ease-in-out infinite; }
  </style>
  <circle cx="460" cy="16" r="14" fill="url(#nodeGlow)" class="glow-pulse"/>
  <line x1="24" y1="16" x2="896" y2="16" stroke="url(#dividerLine)" stroke-width="2"/>
  <polygon points="460,8 468,16 460,24 452,16" fill="url(#diamondGrad)" stroke="#f8fafc" stroke-width="0.5"/>
  <circle cx="460" cy="16" r="3" fill="#ffffff"/>
  <!-- Side accent nodes -->
  <circle cx="120" cy="16" r="2" fill="#38bdf8" opacity="0.5"/>
  <circle cx="800" cy="16" r="2" fill="#a855f7" opacity="0.5"/>
</svg>
