<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="40%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="65%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0f2fe"/>
      <stop offset="65%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="80%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="avatarRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="10%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="90%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.4"/>
      <circle cx="28" cy="0" r="1.2" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="avatarClip">
      <circle cx="780" cy="155" r="62"/>
    </clipPath>
  </defs>

  <style>
    @keyframes pulseLive { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.88)} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @keyframes drift { 0%{transform:translateX(0)} 100%{transform:translateX(-28px)} }
    @keyframes shimmer { 0%{stop-opacity:.3} 50%{stop-opacity:.9} 100%{stop-opacity:.3} }
    @keyframes orbit { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .status-pulse { animation:pulseLive 2s ease-in-out infinite; transform-origin:730px 48px; }
    .float-a { animation:float 4s ease-in-out infinite; }
    .float-b { animation:float 5s ease-in-out infinite .8s; }
    .float-c { animation:float 3.5s ease-in-out infinite 1.2s; }
    .orbit-ring { animation:orbit 20s linear infinite; transform-origin:780px 155px; }
    .cursor-blink { animation:blink 1s step-end infinite; }
    .mono { font-family:'JetBrains Mono','SF Mono',Consolas,monospace; }
    .sans { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  </style>

  <!-- Card shell -->
  <rect x="2" y="2" width="916" height="316" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
  <rect x="2" y="2" width="916" height="316" rx="20" fill="url(#grid)"/>
  <rect x="2" y="2" width="916" height="316" rx="20" fill="url(#cyanGlow)"/>
  <rect x="2" y="2" width="916" height="316" rx="20" fill="url(#purpleGlow)"/>
  <rect x="2" y="2" width="916" height="316" rx="20" fill="url(#centerGlow)"/>

  <!-- Floating code brackets -->
  <g class="float-a" opacity="0.15">
    <text x="680" y="280" class="mono" font-size="72" font-weight="700" fill="#38bdf8">{</text>
  </g>
  <g class="float-b" opacity="0.12">
    <text x="820" y="90" class="mono" font-size="56" font-weight="700" fill="#818cf8">/</text>
  </g>
  <g class="float-c" opacity="0.1">
    <text x="40" y="290" class="mono" font-size="48" font-weight="700" fill="#a855f7">}</text>
  </g>

  <!-- Circuit corners -->
  <path d="M 28 52 L 28 28 L 52 28" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.8"/>
  <circle cx="52" cy="28" r="3" fill="#38bdf8"/>
  <path d="M 892 268 L 892 292 L 868 292" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-opacity="0.8"/>
  <circle cx="868" cy="292" r="3" fill="#a855f7"/>

  <!-- HUD bar -->
  <rect x="44" y="38" width="178" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="58" y="57" class="mono" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="1.2">DEV_PORTFOLIO // v3.0</text>

  <!-- Status badge -->
  <rect x="640" y="38" width="236" height="28" rx="14" fill="#091322" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="658" cy="52" class="status-pulse" r="5" fill="#22d3ee"/>
  <text x="672" y="57" class="mono" font-size="11" fill="#94a3b8">STATUS: <tspan fill="#38bdf8" font-weight="700">OPEN FOR ROLES</tspan></text>

  <!-- Main title -->
  <text x="44" y="128" class="sans" font-size="48" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">Praveen Verma</text>
  <rect x="44" y="142" width="520" height="3" rx="1.5" fill="url(#accentLineGrad)" filter="url(#glow)"/>

  <!-- Subtitle -->
  <text x="44" y="178" class="sans" font-size="17" font-weight="600" fill="#e2e8f0">
    Full Stack Engineer <tspan fill="#475569">|</tspan> <tspan fill="#38bdf8">MERN Architect</tspan> <tspan fill="#475569">|</tspan> <tspan fill="#c084fc">400+ DSA</tspan>
  </text>
  <text x="44" y="204" class="sans" font-size="13.5" fill="#94a3b8">
    Building production-grade SaaS · Secure APIs · Optimized databases · Pixel-perfect UIs
  </text>

  <!-- Terminal snippet -->
  <rect x="44" y="222" width="340" height="68" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="60" cy="238" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="76" cy="238" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="92" cy="238" r="5" fill="#22c55e" opacity="0.8"/>
  <text x="58" y="262" class="mono" font-size="11" fill="#64748b">$ whoami</text>
  <text x="58" y="280" class="mono" font-size="11.5" fill="#38bdf8">→ fullstack_engineer</text>
  <text x="210" y="280" class="mono" font-size="11.5" fill="#22c55e">✓ production_ready</text>

  <!-- Tech chips -->
  <g transform="translate(400, 232)">
    <rect x="0" y="0" width="78" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="12" cy="12" r="3" fill="#38bdf8"/><text x="20" y="16" class="mono" font-size="10.5" fill="#cbd5e1">React</text>
    <rect x="86" y="0" width="72" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="98" cy="12" r="3" fill="#22c55e"/><text x="106" y="16" class="mono" font-size="10.5" fill="#cbd5e1">Node</text>
    <rect x="166" y="0" width="88" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="178" cy="12" r="3" fill="#10b981"/><text x="186" y="16" class="mono" font-size="10.5" fill="#cbd5e1">MongoDB</text>
    <rect x="0" y="32" width="96" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="12" cy="44" r="3" fill="#60a5fa"/><text x="20" y="48" class="mono" font-size="10.5" fill="#cbd5e1">TypeScript</text>
    <rect x="104" y="32" width="90" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="116" cy="44" r="3" fill="#818cf8"/><text x="124" y="48" class="mono" font-size="10.5" fill="#cbd5e1">Razorpay</text>
    <rect x="202" y="32" width="72" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="214" cy="44" r="3" fill="#c084fc"/><text x="222" y="48" class="mono" font-size="10.5" fill="#cbd5e1">REST</text>
  </g>

  <!-- Avatar ring + placeholder -->
  <circle cx="780" cy="155" r="68" fill="none" stroke="url(#avatarRing)" stroke-width="3" class="orbit-ring" stroke-dasharray="8 6" opacity="0.7"/>
  <circle cx="780" cy="155" r="64" fill="none" stroke="url(#avatarRing)" stroke-width="2.5"/>
  <circle cx="780" cy="155" r="60" fill="#1e293b"/>
  <text x="780" y="163" text-anchor="middle" class="sans" font-size="36" font-weight="800" fill="#38bdf8">PV</text>
  <text x="780" y="240" text-anchor="middle" class="mono" font-size="10" fill="#64748b">@praveenstp09</text>

  <!-- Particle dots -->
  <circle cx="600" cy="60" r="2" fill="#38bdf8" opacity="0.6" class="float-a"/>
  <circle cx="550" cy="100" r="1.5" fill="#818cf8" opacity="0.5" class="float-b"/>
  <circle cx="620" cy="190" r="2" fill="#a855f7" opacity="0.5" class="float-c"/>
  <circle cx="500" cy="250" r="1.5" fill="#06b6d4" opacity="0.4" class="float-a"/>
</svg>
